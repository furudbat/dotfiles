# -----------------------------------------------------
# General window decoration
# name: "Custom: No Rounding, No transparency"
# -----------------------------------------------------

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(00000050)
    }
}
