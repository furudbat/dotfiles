# -----------------------------------------------------
# General window layout and colors
# name: "Custom"
# -----------------------------------------------------

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(fed07cff) rgba(b18121ff) 90deg
    col.inactive_border = $on_primary
    col.nogroup_border = $on_primary_fixed
    col.nogroup_border_active = rgba(b18121ff)
    layout = dwindle
    resize_on_border = true

    gaps_workspaces = 0
    allow_tearing = false
}

