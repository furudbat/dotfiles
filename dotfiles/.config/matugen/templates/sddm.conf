; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "ml4w.jpg"
use-background-color = false
background-color = "#000000"
blur = 32
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "FiraSans Semibold"
font-size = 100
font-weight = 600
color = "{{colors.on_surface.default.hex}}"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "FiraSans Semibold"
font-size = 20
font-weight = 600
color = "{{colors.on_surface.default.hex}}"
margin-top = 10

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "FiraSans Semibold"
font-size = 16
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 20
color = "{{colors.on_surface.default.hex}}"
paint-icon = true
spacing = 0

[LoginScreen]
background = "ml4w.jpg"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 200
inactive-size = 100
inactive-opacity = 0.55
active-border-size = 0
inactive-border-size = 0
active-border-color = "{{colors.primary.default.hex}}"
inactive-border-color = "{{colors.primary.default.hex}}"

[LoginScreen.LoginArea.Username]
font-family = "FiraSans Semibold"
font-size = 20
font-weight = 600
color = "{{colors.on_primary_container.default.hex}}"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 50
display-icon = true
font-family = "FiraSans Semibold"
font-size = 16
icon = "password.svg"
icon-size = 16
content-color = "{{colors.on_primary_container.default.hex}}"
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
border-size = 1
border-color = "{{colors.on_primary_fixed_variant.default.hex}}"
border-radius-left = 4
border-radius-right = 4
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "{{colors.on_primary.default.hex}}"
background-opacity = 0.75
active-background-color = "{{colors.inverse_primary.default.hex}}"
active-background-opacity = 0.85
icon = "arrow-right.svg"
icon-size = 18
content-color = "{{colors.primary.default.hex}}"
active-content-color = "{{colors.primary_fixed_dim.default.hex}}"
border-size = 1
border-color = "{{colors.source_color.default.hex}}"
border-radius-left = 2
border-radius-right = 2
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "FiraSans Semibold"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "FiraSans Semibold"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "{{colors.on_primary_container.default.hex}}"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "FiraSans Semibold"
font-size = 20
font-weight = 400
normal-color = "{{colors.on_primary_container.default.hex}}"
warning-color = "{{colors.primary.default.hex}}"
error-color = "{{colors.error.default.hex}}"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 2
spacing = 10
font-family = "FiraSans Semibold"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.55
active-option-background-color = "{{colors.on_primary_fixed.default.hex}}"
active-option-background-opacity = 0.75
content-color = "{{colors.on_primary_container.default.hex}}"
active-content-color = "{{colors.on_primary_container.default.hex}}"
font-family = "FiraSans Semibold"
border-size = 0
border-color = "{{colors.primary_fixed_dim.default.hex}}"
font-size = 16
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 300
popup-width = 300
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
active-background-opacity = 0.85
content-color = "{{colors.on_primary_container.default.hex}}"
active-content-color = "{{colors.on_primary_container.default.hex}}"
border-size = 0
font-size = 16
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
active-background-opacity = 0.85
content-color = "{{colors.on_primary_container.default.hex}}"
active-content-color = "{{colors.on_primary_container.default.hex}}"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 20

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
active-background-opacity = 0.85
content-color = "{{colors.on_primary_container.default.hex}}"
active-content-color = "{{colors.on_primary_container.default.hex}}"
border-size = 0
icon = "keyboard.svg"
icon-size = 20

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
active-background-opacity = 0.85
content-color = "{{colors.on_primary_container.default.hex}}"
active-content-color = "{{colors.on_primary_container.default.hex}}"
border-size = 0
icon = "power.svg"
icon-size = 20

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "{{colors.background.default.hex}}"
background-opacity = 0.55
key-content-color = "{{colors.surface.default.hex}}"
key-color = "{{colors.primary_fixed.default.hex}}"
key-opacity = 0.75
key-active-background-color = "{{colors.on_tertiary_container.default.hex}}"
key-active-opacity = 0.85
selection-background-color = "{{colors.on_secondary.default.hex}}"
selection-content-color = "{{colors.on_secondary_container.default.hex}}"
primary-color = "{{colors.surface_bright.default.hex}}"
border-size = 0
border-color = "{{colors.outline.default.hex}}"

[Tooltips]
enable = true
font-family = "FiraSans Semibold"
font-size = 11
content-color = "{{colors.on_primary_container.default.hex}}"
background-color = "{{colors.on_primary_fixed.default.hex}}"
background-opacity = 0.75
border-radius = 3
disable-user = false
disable-login-button = false
