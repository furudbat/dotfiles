[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
dim_foreground = "#7f849c"
bright_foreground = "#EEFCFE"

[colors.cursor]
text = "{{colors.on_surface_variant.default.hex}}"
cursor = "{{colors.on_surface.default.hex}}"

[colors.vi_mode_cursor]
text = '{{colors.background.default.hex}}'
cursor = '{{colors.primary.default.hex}}' 

[colors.search.matches]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.tertiary.default.hex}}' 

[colors.search.focused_match]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.primary.default.hex}}' 
 
[colors.footer_bar]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.inverse_surface.default.hex}}' 

[colors.hints.start]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.secondary.default.hex}}' 

[colors.hints.end]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.secondary.default.hex}}' 

[colors.selection]
text = '{{colors.background.default.hex}}'
background = '{{colors.primary.default.hex}}'

[colors.normal]
black = "#45475a"
#red = "#D60150"
#green = "#3BCA37"
#yellow = "#FFE700"
#blue = "#0065B5"
#magenta = "#F289B7"
#cyan = "#2CA19A"
red = '{{colors.error.default.hex}}' 
green = '{{colors.primary.default.hex}}' 
yellow = '{{colors.inverse_primary.default.hex}}' 
blue = '{{colors.primary.default.hex}}' 
magenta = '{{colors.tertiary.default.hex}}' 
cyan = '{{colors.secondary.default.hex}}' 
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#D60150"
green = "#3BCA37"
yellow = "#FFE700"
blue = "#0065B5"
magenta = "#F289B7"
cyan = "#2CA19A"
white = "#a6adc8"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#FFE700"